---
- name: use template
  hosts: all
  become: true

  tasks:

    - name: use a Template to collect information 
      ansible.builtin.template:
        src: ./myhosts.j2
        dest: /etc/myhosts

- name: use template
  hosts: all, !dev
  become: true
  
  tasks:
  
    - name: Remove myhosts file  in all node eccept dev
      ansible.builtin.file:
        path: /etc/myhosts
        state: absent



